<style>
  :root {
    --bg: #f8f9fa;
    --surface: #F9FAFD;
    --surface2: #f1f3f4;
    --border: #dadce0;
    --text: #202124;
    --text-muted: #70757a;
    --accent: #1a73e8;
    --accent2: #ea4335;
    --accent3: #34a853;
    --accent4: #fbbc04;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .logo span { color: var(--accent); }

  .nav-week {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .nav-week button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .nav-week button:hover { background: var(--surface2); }
  .week-label {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    min-width: 180px;
    text-align: center;
  }
  .today-btn {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0 20px;
    height: 32px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all .15s;
  }
  .today-btn:hover { border-color: var(--accent); color: var(--accent); background: #f0f4ff; }
  .io-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    transition: all .15s;
    white-space: nowrap;
  }
  .io-btn:hover { border-color: var(--accent3); color: var(--accent3); }

  /* MAIN LAYOUT */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* LEFT PANEL */
  .sidebar {
    width: 258px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px 16px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-title {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .add-template-btn {
    width: 26px; height: 26px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    transition: opacity .15s;
  }
  .add-template-btn:hover { opacity: .8; }

  .template-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 5px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .template-list::-webkit-scrollbar { width: 4px; }
  .template-list::-webkit-scrollbar-track { background: transparent; }
  .template-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .template-item {
    padding: 10px 36px 10px 32px;
    border-radius: 10px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: border-color .15s, background .15s;
    position: relative;
    user-select: none;
  }
  .template-item.dragging-sort { opacity: .4; }
  .template-item.drag-over-sort {
    border-color: var(--accent) !important;
    background: #e8f0fe !important;
  }
  .template-item:hover:not(.selected) {
    background: var(--surface2);
    border-color: var(--border);
  }
  .template-del-btn {
    position: absolute;
    left: 6px; top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    display: none;
    align-items: center; justify-content: center;
  }
  .template-item:hover .template-del-btn { display: flex; }
  .template-del-btn:hover { color: var(--accent2); }
  .template-edit-btn {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    display: none;
    align-items: center; justify-content: center;
  }
  .template-item:hover .template-edit-btn { display: flex; }
  .template-edit-btn:hover { color: var(--text); }
  .template-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    flex-shrink: 0;
  }
  .template-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    display: flex;
    align-items: center;
  }
  .template-item.selected {
    /* color set dynamically per template */
  }

  .prompt-template {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
  }
  .prompt-template-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .prompt-template-title {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .copy-prompt-btn {
    width: 26px;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }
  .copy-prompt-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #f0f4ff;
  }
  .copy-prompt-btn svg {
    width: 14px;
    height: 14px;
  }
  .copy-status {
    min-height: 16px;
    margin-top: 6px;
    font-size: 10px;
    color: var(--accent3);
  }

  /* CALENDAR AREA */
  .calendar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Day headers — now sticky rows inside the single grid */
  .time-gutter-header {
    position: sticky;
    top: 0;
    z-index: 15;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    grid-column: 1;
    width: 52px;
  }
  .day-head {
    position: sticky;
    top: 0;
    z-index: 15;
    padding: 10px 0 8px;
    text-align: center;
    border-left: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .day-head .dow {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .8px;
  }
  .day-head .dom {
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
    margin-top: 4px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: auto;
    margin-right: auto;
    border-radius: 50%;
  }
  .day-head.today .dom {
    background: var(--accent);
    color: #fff;
  }
  .day-head.today .dow { color: var(--accent); }

  /* Scrollable time grid */
  .time-grid-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    background: #fff;
  }
  .time-grid-scroll::-webkit-scrollbar { width: 6px; }
  .time-grid-scroll::-webkit-scrollbar-track { background: transparent; }
  .time-grid-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .time-grid {
    display: grid;
    grid-template-columns: 52px repeat(7, 1fr);
    position: relative;
    background: #fff;
  }

  .time-gutter {
    grid-column: 1;
    grid-row: 2 / span 24;
    position: relative;
  }

  .time-slot-label {
    height: 60px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 0 8px 0 0;
    font-size: 10px;
    color: var(--text-muted);
    padding-top: 2px;
    letter-spacing: .3px;
  }

  .day-col {
    border-left: 1px solid var(--border);
    position: relative;
    min-height: 1440px;
  }

  .hour-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: var(--border);
  }
  .half-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: #ececec;
    border-top: 1px dashed #ececec;
  }

  /* Current time indicator */
  .now-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: var(--accent2);
    z-index: 10;
    pointer-events: none;
  }
  .now-dot {
    position: absolute;
    left: -4px;
    top: -4px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent2);
  }

  .cal-event {
    position: absolute;
    left: 3px; right: 3px;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    cursor: grab;
    overflow: hidden;
    border: none;
    z-index: 5;
    transition: filter .1s, opacity .1s;
  }
  .cal-event:active { cursor: grabbing; }
  .cal-event:hover { filter: brightness(0.95); }
  .cal-event .ev-title {
    font-weight: 600;
    font-size: 12px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-event .ev-time {
    font-size: 10px;
    opacity: .75;
    margin-top: 1px;
  }
  .cal-event .ev-memo {
    font-size: 10px;
    opacity: .75;
    margin-top: 1px;
    overflow: hidden;
    display: flex;
    align-items: flex-start;
    gap: 3px;
    max-height: calc(10 * 1.4em);
  }
  .cal-event .ev-memo-icon {
    flex-shrink: 0;
    font-size: 10px;
    display: inline-block;
    transform: scaleX(-1);
    margin-top: 1px;
  }
  .cal-event .ev-meta-label {
    flex-shrink: 0;
    font-size: 9px;
    font-weight: 700;
    opacity: .85;
    min-width: 20px;
  }
  .cal-event .ev-memo-text {
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 10;
    -webkit-box-orient: vertical;
    line-height: 1.4;
    word-break: break-word;
  }
  .cal-event .ev-delete {
    position: absolute;
    top: 4px; right: 4px;
    width: 16px; height: 16px;
    border-radius: 4px;
    border: none;
    background: rgba(0,0,0,.15);
    color: var(--text);
    cursor: pointer;
    font-size: 10px;
    display: none;
    align-items: center; justify-content: center;
    line-height: 1;
    z-index: 2;
  }
  .cal-event:hover .ev-delete { display: flex; }
  .ev-resize-handle {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 8px;
    cursor: ns-resize;
    border-radius: 0 0 6px 6px;
    background: transparent;
    z-index: 3;
  }
  .ev-resize-handle::after {
    content: '';
    display: block;
    width: 24px;
    height: 3px;
    border-radius: 2px;
    background: rgba(0,0,0,0.2);
    margin: 2px auto 0;
  }
  .cal-event:hover .ev-resize-handle::after { background: rgba(0,0,0,0.35); }

  /* DRAG PREVIEW */
  .drag-preview {
    position: absolute;
    left: 3px; right: 3px;
    border-radius: 6px;
    opacity: .5;
    pointer-events: none;
    z-index: 20;
    border: 2px dashed #888;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(2px);
    z-index: 100;
    display: flex;

  .form-group { margin-bottom: 16px; }

  .btn-primary {

    cursor: pointer;

    font-family: 'DM Sans', sans-serif;

  .btn-primary:hover { opacity: .85; }

  .empty-templates {

    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.7;
  }
  .empty-templates .icon { font-size: 28px; margin-bottom: 8px; }
</style>
</head>
<body>

<script>
const COLORS = [
  '#D50000','#E67C73','#F4511E','#F6BF26',
  '#33B679','#0B8043','#039BE5','#4285F4',
  '#3F51B5','#7986CB','#8E24AA','#616161',
];

const STORAGE_KEYS = {
  templates: 'tcal_templates',
  events: 'tcal_events',
  colorMigration: 'tcal_color_migrated_google_v1',
};

const GEMINI_PROMPT_B64 = '5LuK5pel44Gu5LqI5a6a44KS44GZ44G544GmR29vZ2xl44Kr44Os44Oz44OA44O844Gr6L+95Yqg44GX44Gm44CCCuWFpeWKm+WFiOOBr+OBneOCjOOBnuOCjGNhbOOBp+aMh+WumuOBleOCjOOBpuOBhOOCi+OCq+ODrOODs+ODgOODvOOBq+OBquOCiuOBvuOBmeOAggrjgqvjg6zjg7Pjg4Djg7zjgpLmjIflrprjgZfjgabjgYTjgarjgYTkuojlrprjga7nmbvpjLLjga/kuI3opoHjgafjgZnjgII=';

// STATE
let state = {
  weekOffset: 0,
  templates: [],
  events: [],       // {id, templateId, date, startMin, endMin}
  selectedTemplate: null,
  editingTemplateId: null,
  pickedColor: COLORS[0],
};

// PERSISTENCE
function save() {
  try {
    if (typeof localStorage === 'undefined') return;
    localStorage.setItem(STORAGE_KEYS.templates, JSON.stringify(state.templates));
    localStorage.setItem(STORAGE_KEYS.events, JSON.stringify(state.events));
  } catch(e) {
    console.warn('データをブラウザに保存できませんでした。', e);
  }
}
function load() {
  try {
    if (typeof localStorage === 'undefined') return;
    const t = localStorage.getItem(STORAGE_KEYS.templates);
    const e = localStorage.getItem(STORAGE_KEYS.events);
    if (t) state.templates = JSON.parse(t);
    if (e) state.events = JSON.parse(e);
    migrateColorsToGooglePalette();
  } catch(e) {}
}

// HELPERS
function getWeekDates(offset) {
  const today = new Date();
  const day = today.getDay(); // 0=Sun
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((day + 6) % 7) + offset * 7);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d);
  }
  return dates;
}
function dateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatTime(min) {
  const h = Math.floor(min/60), m = min%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function escapeHTML(value = '') {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[ch]));
}
function hexToRgb(hex) {
  const normalized = String(hex || '').trim().replace('#', '');
  if (!/^[0-9a-fA-F]{6}$/.test(normalized)) return null;
  return {
    r: parseInt(normalized.slice(0, 2), 16),
    g: parseInt(normalized.slice(2, 4), 16),
    b: parseInt(normalized.slice(4, 6), 16),
  };
}
function getClosestPaletteColor(color) {
  const source = hexToRgb(color);
  if (!source) return COLORS[0];
  return COLORS.reduce((closest, paletteColor) => {
    const target = hexToRgb(paletteColor);
    const distance =
      (source.r - target.r) ** 2 +
      (source.g - target.g) ** 2 +
      (source.b - target.b) ** 2;
    return distance < closest.distance ? { color: paletteColor, distance } : closest;
  }, { color: COLORS[0], distance: Infinity }).color;
}
function migrateColorsToGooglePalette(force = false) {
  if (!force && typeof localStorage !== 'undefined' && localStorage.getItem(STORAGE_KEYS.colorMigration) === '1') return;

  let changed = false;
  [...state.templates, ...state.events].forEach(item => {
    if (!item.color) return;
    const nextColor = getClosestPaletteColor(item.color);
    if (item.color !== nextColor) {
      item.color = nextColor;
      changed = true;
    }
  });

  if (typeof localStorage !== 'undefined') {
    localStorage.setItem(STORAGE_KEYS.colorMigration, '1');
  }
  if (changed) save();
}
function getGeminiPrompt() {
  const bytes = Uint8Array.from(atob(GEMINI_PROMPT_B64), ch => ch.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
const DOW_JA = ['月','火','水','木','金','土','日'];
const MONTH_JA = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

// RENDER HEADER (week label only — day heads are rendered inside grid)
function renderHeader() {
  const dates = getWeekDates(state.weekOffset);
  const label = `${dates[0].getFullYear()}年 ${MONTH_JA[dates[0].getMonth()]} ${dates[0].getDate()}日 — ${dates[6].getDate()}日`;
  document.getElementById('weekLabel').textContent = label;
}

// RENDER GRID
let dragState = null;

function renderGrid() {
  const dates = getWeekDates(state.weekOffset);
  const grid = document.getElementById('timeGrid');
  grid.innerHTML = '';

  // ── Header row (sticky) ──
  const gutterHead = document.createElement('div');
  gutterHead.className = 'time-gutter-header';
  grid.appendChild(gutterHead);

  const todayStr = dateStr(new Date());
  dates.forEach((d, i) => {
    const isToday = dateStr(d) === todayStr;
    const dh = document.createElement('div');
    dh.className = 'day-head' + (isToday ? ' today' : '');
    dh.innerHTML = `<div class="dow">${DOW_JA[i]}</div><div class="dom">${d.getDate()}</div>`;
    grid.appendChild(dh);
  });

  // Time gutter
  const gutter = document.createElement('div');
  gutter.className = 'time-gutter';
  for (let h = 0; h < 24; h++) {
    const slot = document.createElement('div');
    slot.className = 'time-slot-label';
    slot.textContent = h === 0 ? '' : `${String(h).padStart(2,'0')}:00`;
    gutter.appendChild(slot);
  }
  grid.appendChild(gutter);

  // Day columns
  const today = dateStr(new Date());
  dates.forEach((d) => {
    const ds = dateStr(d);
    const col = document.createElement('div');
    col.className = 'day-col';
    col.dataset.date = ds;

    // Hour/half lines
    for (let h = 0; h < 24; h++) {
      const line = document.createElement('div');
      line.className = 'hour-line';
      line.style.top = (h * 60) + 'px';
      col.appendChild(line);
      if (h > 0) {
        const half = document.createElement('div');
        half.className = 'half-line';
        half.style.top = (h * 60 - 30) + 'px';
        col.appendChild(half);
      }
    }

    // Current time
    if (ds === today) {
      const now = new Date();
      const nowMin = now.getHours()*60 + now.getMinutes();
      const nowLine = document.createElement('div');
      nowLine.className = 'now-line';
      nowLine.style.top = nowMin + 'px';
      const dot = document.createElement('div');
      dot.className = 'now-dot';
      nowLine.appendChild(dot);
      col.appendChild(nowLine);
    }

    // Events
    state.events.filter(ev => ev.date === ds).forEach(ev => {
      renderEvent(col, ev);
    });

    // Drag interactions
    col.addEventListener('mousedown', onColMouseDown);

    grid.appendChild(col);
  });
}

function getMinFromY(clientY) {
  const scroll = document.getElementById('gridScroll');
  const gridRect = scroll.getBoundingClientRect();
  const headerHeight = document.querySelector('.time-gutter-header').offsetHeight;
  const y = clientY - gridRect.top - headerHeight + scroll.scrollTop;
  return Math.max(0, Math.min(1440, Math.round(y / 15) * 15));
}

function getColFromX(clientX) {
  const cols = document.querySelectorAll('.day-col');
  for (const col of cols) {
    const r = col.getBoundingClientRect();
    if (clientX >= r.left && clientX < r.right) return col;
  }
  return null;
}

function updateEventEl(el, ev) {
  el.style.top = ev.startMin + 'px';
  el.style.height = Math.max(15, ev.endMin - ev.startMin) + 'px';
  el.querySelector('.ev-time').textContent = `${formatTime(ev.startMin)} – ${formatTime(ev.endMin)}`;
}

function renderEvent(col, ev) {
  const color = ev.color || '#7c6aff';
  const title = ev.title || '(削除済みテンプレート)';
  const el = document.createElement('div');
  el.className = 'cal-event';
  el.dataset.evId = ev.id;
  el.style.top = ev.startMin + 'px';
  el.style.height = Math.max(15, ev.endMin - ev.startMin) + 'px';
  el.style.background = color + '33';
  el.style.borderLeft = `3px solid ${color}`;
  el.style.color = color;
  el.innerHTML = `
    <div class="ev-title">${escapeHTML(title)}</div>
    <div class="ev-time">${formatTime(ev.startMin)} – ${formatTime(ev.endMin)}</div>
    ${ev.calendar ? `<div class="ev-memo"><span class="ev-meta-label">Cal</span><span class="ev-memo-text">${escapeHTML(ev.calendar)}</span></div>` : ''}
    ${ev.location ? `<div class="ev-memo"><span class="ev-meta-label">Loc</span><span class="ev-memo-text">${escapeHTML(ev.location)}</span></div>` : ''}
    ${ev.memo ? `<div class="ev-memo"><span class="ev-meta-label">説明</span><span class="ev-memo-text">${escapeHTML(ev.memo)}</span></div>` : ''}
    <button class="ev-delete">✕</button>
    <div class="ev-resize-handle"></div>
  `;

  // Delete
  el.querySelector('.ev-delete').addEventListener('mousedown', (e) => {
    e.stopPropagation();
  });
  el.querySelector('.ev-delete').addEventListener('click', (e) => {
    e.stopPropagation();
    state.events = state.events.filter(x => x.id !== ev.id);
    save();
    renderGrid();
  });

  // ── RESIZE (bottom handle) ──
  const handle = el.querySelector('.ev-resize-handle');
  handle.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    const origEnd = ev.endMin;

    const onMove = (me) => {
      const newEnd = Math.max(ev.startMin + 15, getMinFromY(me.clientY));
      ev.endMin = newEnd;
      updateEventEl(el, ev);
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      save();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // ── DOUBLE CLICK to edit ──
  el.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    openQuickEventModal(ev.date, ev.startMin, ev.endMin, ev);
  });

  // ── MOVE (drag event body) ──
  el.addEventListener('mousedown', (e) => {
    if (e.target.closest('.ev-delete')) return;
    if (e.target.closest('.ev-resize-handle')) return;
    e.stopPropagation();
    e.preventDefault();

    const startX = e.clientX, startY = e.clientY;
    let dragging = false;
    const duration = ev.endMin - ev.startMin;
    const grabOffsetMin = getMinFromY(e.clientY) - ev.startMin;
    let ghost = null;
    let currentCol = col;

    const onMove = (me) => {
      const dx = me.clientX - startX, dy = me.clientY - startY;
      if (!dragging && Math.sqrt(dx*dx + dy*dy) < 6) return;
      if (!dragging) {
        dragging = true;
        ghost = el.cloneNode(true);
        ghost.style.opacity = '0.5';
        ghost.style.pointerEvents = 'none';
        ghost.style.zIndex = '30';
        el.style.opacity = '0.3';
        col.appendChild(ghost);
      }
      const newStart = Math.max(0, getMinFromY(me.clientY) - grabOffsetMin);
      const newEnd = newStart + duration;
      const targetCol = getColFromX(me.clientX) || currentCol;
      if (targetCol !== ghost.parentElement) targetCol.appendChild(ghost);
      ghost.style.top = newStart + 'px';
      ghost.style.height = Math.max(15, duration) + 'px';
      ghost.querySelector('.ev-time').textContent = `${formatTime(newStart)} – ${formatTime(newEnd)}`;
      currentCol = targetCol;
    };

    const onUp = (me) => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (!dragging) return; // クリック/ダブルクリックはここで終了
      ghost.remove();
      el.style.opacity = '';
      const newStart = Math.max(0, getMinFromY(me.clientY) - grabOffsetMin);
      const newEnd = newStart + duration;
      const targetCol = getColFromX(me.clientX) || col;
      ev.startMin = newStart;
      ev.endMin = newEnd;
      ev.date = targetCol.dataset.date;
      save();
      renderGrid();
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  col.appendChild(el);
}

// pending quick-event state
let pendingQuickEvent = null;
let quickPickedColor = COLORS[0];

function openQuickEventModal(date, startMin, endMin, editingEv = null) {
  pendingQuickEvent = { date, startMin, endMin, editingId: editingEv ? editingEv.id : null };
  quickPickedColor = editingEv ? editingEv.color : COLORS[0];
  document.getElementById('quickEventTime').textContent =
    `${formatTime(startMin)} – ${formatTime(endMin)}`;
  document.getElementById('quickTitle').value = editingEv ? editingEv.title : '';
  document.getElementById('quickCalendar').value = editingEv ? (editingEv.calendar || '') : '';
  document.getElementById('quickLocation').value = editingEv ? (editingEv.location || '') : '';
  document.getElementById('quickMemo').value = editingEv ? (editingEv.memo || '') : '';
  document.getElementById('saveQuickEvent').textContent = editingEv ? '更新' : '保存';
  renderQuickColorPicker();
  document.getElementById('quickEventModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('quickTitle').focus(), 50);
}

function renderQuickColorPicker() {
  const cp = document.getElementById('quickColorPicker');
  cp.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c === quickPickedColor ? ' active' : '');
    sw.style.background = c;
    sw.addEventListener('click', () => { quickPickedColor = c; renderQuickColorPicker(); });
    cp.appendChild(sw);
  });
}

document.getElementById('cancelQuickEvent').addEventListener('click', () => {
  document.getElementById('quickEventModal').classList.add('hidden');
  pendingQuickEvent = null;
});
document.getElementById('quickEventModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById('quickEventModal').classList.add('hidden');
    pendingQuickEvent = null;
  }
});
document.getElementById('saveQuickEvent').addEventListener('click', () => {
  const title = document.getElementById('quickTitle').value.trim();
  if (!title) { document.getElementById('quickTitle').focus(); return; }
  if (!pendingQuickEvent) return;

  if (pendingQuickEvent.editingId) {
    // 編集モード：既存イベントを上書き
    const ev = state.events.find(x => x.id === pendingQuickEvent.editingId);
    if (ev) {
      ev.title = title;
      ev.color = quickPickedColor;
      ev.calendar = document.getElementById('quickCalendar').value.trim();
      ev.location = document.getElementById('quickLocation').value.trim();
      ev.memo = document.getElementById('quickMemo').value.trim();
    }
  } else {
    // 新規作成
    state.events.push({
      id: Date.now().toString(),
      templateId: null,
      title,
      color: quickPickedColor,
      calendar: document.getElementById('quickCalendar').value.trim(),
      location: document.getElementById('quickLocation').value.trim(),
      memo: document.getElementById('quickMemo').value.trim(),
      date: pendingQuickEvent.date,
      startMin: pendingQuickEvent.startMin,
      endMin: pendingQuickEvent.endMin,
    });
  }
  save();
  renderGrid();
  document.getElementById('quickEventModal').classList.add('hidden');
  pendingQuickEvent = null;
});
document.getElementById('quickTitle').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('cancelQuickEvent').click();
});

function onColMouseDown(e) {
  if (e.button !== 0) return;
  if (e.target.closest('.cal-event')) return;

  const col = e.currentTarget;
  const startMin = getMinFromY(e.clientY);
  const tmpl = state.selectedTemplate;
  const previewColor = tmpl ? tmpl.color : '#7c6aff';

  const preview = document.createElement('div');
  preview.className = 'drag-preview';
  preview.style.top = startMin + 'px';
  preview.style.height = '15px';
  preview.style.background = previewColor + '44';
  preview.style.borderLeft = `3px solid ${previewColor}`;
  preview.style.borderRadius = '8px';
  col.appendChild(preview);

  dragState = { col, startMin, currentMin: startMin, preview };

  const onMove = (mv) => {
    const curMin = getMinFromY(mv.clientY);
    const top = Math.min(startMin, curMin);
    const bot = Math.max(startMin + 15, curMin);
    preview.style.top = top + 'px';
    preview.style.height = (bot - top) + 'px';
    dragState.currentMin = curMin;
  };

  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if (!dragState) return;
    const s = Math.min(startMin, dragState.currentMin);
    const en = Math.max(startMin + 15, dragState.currentMin);
    preview.remove();
    dragState = null;

    if (tmpl) {
      // テンプレートあり → 即保存
      state.events.push({
        id: Date.now().toString(),
        templateId: tmpl.id,
        title: tmpl.title,
        color: tmpl.color,
        calendar: tmpl.calendar || '',
        location: tmpl.location || '',
        memo: tmpl.memo || '',
        date: col.dataset.date,
        startMin: s,
        endMin: en,
      });
      save();
      renderGrid();
    } else {
      // テンプレートなし → 入力モーダルを開く
      openQuickEventModal(col.dataset.date, s, en);
    }
  };

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// TEMPLATES PANEL
let sortDragId = null;

function renderTemplates() {
  const list = document.getElementById('templateList');
  if (state.templates.length === 0) {
    list.innerHTML = `<div class="empty-templates"><div class="icon">📋</div>テンプレートがまだありません<br>+ボタンで追加してください</div>`;
    return;
  }
  list.innerHTML = '';
  state.templates.forEach(t => {
    const item = document.createElement('div');
    item.className = 'template-item' + (state.selectedTemplate?.id === t.id ? ' selected' : '');
    if (state.selectedTemplate?.id === t.id) {
      item.style.borderColor = t.color;
      item.style.background = t.color + '20';
    }
    item.dataset.id = t.id;
    item.draggable = true;
    item.innerHTML = `
      <button class="template-del-btn" title="削除">✕</button>
      <div class="template-name">
        <span class="template-dot" style="background:${t.color}"></span>
        ${escapeHTML(t.title)}
      </div>
      <button class="template-edit-btn" title="編集">✎</button>
    `;

    // Select on click
    item.addEventListener('click', (e) => {
      if (e.target.closest('.template-del-btn')) return;
      if (e.target.closest('.template-edit-btn')) return;
      state.selectedTemplate = state.selectedTemplate?.id === t.id ? null : t;
      renderTemplates();
    });
    item.querySelector('.template-edit-btn').addEventListener('click', () => openEditTemplate(t.id));
    item.querySelector('.template-del-btn').addEventListener('click', () => {
      state.templates = state.templates.filter(x => x.id !== t.id);
      if (state.selectedTemplate?.id === t.id) state.selectedTemplate = null;
      save();
      renderTemplates();
    });

    // Sort drag events
    item.addEventListener('dragstart', (e) => {
      sortDragId = t.id;
      setTimeout(() => item.classList.add('dragging-sort'), 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging-sort');
      list.querySelectorAll('.template-item').forEach(el => el.classList.remove('drag-over-sort'));
      sortDragId = null;
    });
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (sortDragId && sortDragId !== t.id) {
        list.querySelectorAll('.template-item').forEach(el => el.classList.remove('drag-over-sort'));
        item.classList.add('drag-over-sort');
      }
    });
    item.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!sortDragId || sortDragId === t.id) return;
      const fromIdx = state.templates.findIndex(x => x.id === sortDragId);
      const toIdx = state.templates.findIndex(x => x.id === t.id);
      const [moved] = state.templates.splice(fromIdx, 1);
      state.templates.splice(toIdx, 0, moved);
      save();
      renderTemplates();
    });

    list.appendChild(item);
  });
}

// MODAL
function openAddTemplate() {
  state.editingTemplateId = null;
  state.pickedColor = COLORS[0];
  document.getElementById('modalTitle').textContent = 'テンプレートを追加';
  document.getElementById('tmplTitle').value = '';
  document.getElementById('tmplCalendar').value = '';
  document.getElementById('tmplLocation').value = '';
  document.getElementById('tmplMemo').value = '';
  renderColorPicker();
  document.getElementById('templateModal').classList.remove('hidden');
  document.getElementById('tmplTitle').focus();
}
function openEditTemplate(id) {
  const t = state.templates.find(x => x.id === id);
  if (!t) return;
  state.editingTemplateId = id;
  state.pickedColor = t.color;
  document.getElementById('modalTitle').textContent = 'テンプレートを編集';
  document.getElementById('tmplTitle').value = t.title;
  document.getElementById('tmplCalendar').value = t.calendar || '';
  document.getElementById('tmplLocation').value = t.location || '';
  document.getElementById('tmplMemo').value = t.memo || '';
  renderColorPicker();
  document.getElementById('templateModal').classList.remove('hidden');
  document.getElementById('tmplTitle').focus();
}
function closeModal() {
  document.getElementById('templateModal').classList.add('hidden');
}
function renderColorPicker() {
  const cp = document.getElementById('colorPicker');
  cp.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c === state.pickedColor ? ' active' : '');
    sw.style.background = c;
    sw.addEventListener('click', () => {
      state.pickedColor = c;
      renderColorPicker();
    });
    cp.appendChild(sw);
  });
}
function saveTemplate() {
  const title = document.getElementById('tmplTitle').value.trim();
  if (!title) { document.getElementById('tmplTitle').focus(); return; }
  const calendar = document.getElementById('tmplCalendar').value.trim();
  const location = document.getElementById('tmplLocation').value.trim();
  const memo = document.getElementById('tmplMemo').value.trim();
  if (state.editingTemplateId) {
    const t = state.templates.find(x => x.id === state.editingTemplateId);
    if (t) {
      t.title = title;
      t.calendar = calendar;
      t.location = location;
      t.memo = memo;
      t.color = state.pickedColor;
    }
  } else {
    state.templates.push({ id: Date.now().toString(), title, calendar, location, memo, color: state.pickedColor });
  }
  save();
  closeModal();
  renderTemplates();
}

// WEEK NAV
document.getElementById('prevWeek').addEventListener('click', () => {
  state.weekOffset--;
  renderHeader();
  renderGrid();
});
document.getElementById('nextWeek').addEventListener('click', () => {
  state.weekOffset++;
  renderHeader();
  renderGrid();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  state.weekOffset = 0;
  renderHeader();
  renderGrid();
});

// MODAL EVENTS
document.getElementById('openAddTemplate').addEventListener('click', openAddTemplate);
document.getElementById('cancelTemplate').addEventListener('click', closeModal);
document.getElementById('saveTemplate').addEventListener('click', saveTemplate);
document.getElementById('templateModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});
document.getElementById('tmplTitle').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// GEMINI PROMPT COPY
document.getElementById('copyPromptBtn').addEventListener('click', async () => {
  const prompt = getGeminiPrompt();
  const status = document.getElementById('copyStatus');
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(prompt);
    } else {
      const textarea = document.createElement('textarea');
      textarea.value = prompt;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
      textarea.blur();
    }
    status.textContent = 'コピーしました';
  } catch(e) {
    status.textContent = 'コピーできませんでした';
  }
  setTimeout(() => { status.textContent = ''; }, 1800);
});

// EXPORT / IMPORT
document.getElementById('exportBtn').addEventListener('click', () => {
  const data = { templates: state.templates, events: state.events, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `templatecal-${dateStr}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.templates || !data.events) throw new Error('invalid');
      if (!confirm(`インポートします。\nテンプレート: ${data.templates.length}件\n予定: ${data.events.length}件\n\n現在のデータは上書きされます。よろしいですか？`)) return;
      state.templates = data.templates;
      state.events = data.events;
      state.selectedTemplate = null;
      migrateColorsToGooglePalette(true);
      save();
      renderHeader();
      renderGrid();
      renderTemplates();
    } catch {
      alert('ファイルの読み込みに失敗しました。正しいファイルか確認してください。');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

// INIT
load();
renderHeader();
renderGrid();
renderTemplates();

// Scroll to 8:00
document.getElementById('gridScroll').scrollTop = 8 * 60;

// Refresh now-line every minute
setInterval(() => { renderGrid(); }, 60000);
</script>
